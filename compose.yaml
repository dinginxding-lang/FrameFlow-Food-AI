services:
  web:
    build:
      context: .
      target: web
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
  api:
    build:
      context: .
      target: api
    environment:
      API_PORT: "8787"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
    restart: unless-stopped
